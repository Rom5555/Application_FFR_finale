{% extends 'admin_base/base.html' %}
{% load crispy_forms_tags %}
{% block content %}

<section class="hero is-fullheight-with-navbar">
    <div class="hero-body">
        <div class="container">
            <div class="box has-text-centered has-background-white-ter">
                <h1 class="title is-1 has-text-link mb-6">
                    <span class="icon-text">
                        <span class="icon">
                            <i class="fas fa-hospital-alt"></i>
                        </span>
                        <span>Logimed</span>
                    </span>
                </h1>

                <div class="columns is-centered">
                    <div class="column is-half">
                        <div class="card mb-4">
                            <div class="card-content has-text-centered">
                                <span class="icon has-text-link is-large">
                                    <i class="fas fa-users"></i>
                                </span>
                                <h2 class="title is-4 mt-2">Gestion Comptes</h2>
                                <a href="{% url 'admin_compte:user_list' %}" class="button is-link is-light">Acceder</a>
                            </div>
                        </div>

                        <div class="card mb-4">
                            <div class="card-content has-text-centered">
                                <span class="icon has-text-primary is-large">
                                    <i class="fas fa-box"></i>
                                </span>
                                <h2 class="title is-4 mt-2">Gestion Stocks</h2>
                                <a href="{% url 'admin_stock:display_produits' %}" class="button is-primary is-light">Acceder</a>
                            </div>
                        </div>

                        <div class="card mb-4">
                            <div class="card-content has-text-centered">
                                <span class="icon has-text-info is-large">
                                    <i class="fas fa-clipboard-list"></i>
                                </span>
                                <h2 class="title is-4 mt-2">Gestion Listes</h2>
                                <a href="{% url 'admin_liste:depart_retour' %}" class="button is-info is-light">Acceder</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

{% endblock content %}
