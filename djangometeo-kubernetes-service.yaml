# permet la création d'un répartisseur de charge (load balancer)
# pour l'application django-meteo-app-deployment
# kubernetes va se charger un répartisseur de charge pour le traffic HTTP
#
# Fonctionnement des services kubernetes : https://kubernetes.io/docs/concepts/services-networking/service/
#
# Fonctionnement des répartisseurs de charge HTTP : https://kubernetes.io/docs/tasks/access-application-cluster/create-external-load-balancer/

apiVersion: v1
kind: Service
metadata:
  name: service-clusterip
spec:
  type: ClusterIP
  selector:
    app: application-ffr-app-deployment
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000