stages:
  - build
  - deploy

variables:
  REGISTRY_PROJECT_PATH: registry.gitlab.com/rom5555/application_ffr_finale_v2:latest

build-image:
  image: docker:20.10
  stage: build
  script:
    - apk add --no-cache docker-compose
    - echo "Construction de l'image Docker à partir du fichier Dockerfile du repository..."
    - docker login registry.gitlab.com -u $USER_GITLAB -p $REGISTRY_TOKEN
    - docker-compose build
    - docker-compose push
  tags:
    - runner-gitlab-v2-tag

