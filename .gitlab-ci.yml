stages:
  - build
  - test
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_HOST: tcp://172.17.0.1:2375
  DOCKER_TLS_CERTDIR: ""
  BUILD: "TRUE"

before_script:
  - apk add --no-cache docker-compose

build-image:
  stage: build
  image: docker:20.10
  script:
    - docker login registry.gitlab.com -u $USER_GITLAB -p $REGISTRY_TOKEN
    - docker build -t $REGISTRY_PROJECT_PATH .
    - docker push $REGISTRY_PROJECT_PATH
  tags:
    - runner-perso-poste-tag
  only:
    variables:
      - $BUILD == "TRUE"

test:
  stage: test
  image: docker:20.10
  services:
    - name: docker:20.10-dind
  script:
    - docker login registry.gitlab.com -u $USER_GITLAB -p $REGISTRY_TOKEN
    - docker-compose run web python manage.py test
  tags:
    - runner-perso-poste-tag

deploy:
  stage: deploy
  image: docker:20.10
  services:
    - name: docker:20.10-dind
  script:
    - docker login registry.gitlab.com -u $USER_GITLAB -p $REGISTRY_TOKEN
    - docker-compose up -d
    - docker-compose exec web python manage.py createsuperuser
  environment:
    name: production
    url: http://164.92.202.51:8000
  only:
    - master
  tags:
    - runner-perso-poste-tag
