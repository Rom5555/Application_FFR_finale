stages:
  - build
  - test
  - deploy

services:
  - docker:dind

variables:
  DOCKER_HOST: tcp://docker:2375/
  DOCKER_DRIVER: overlay2

before_script:
  - docker info

build:
  stage: build
  script:
    - docker-compose build

test:
  stage: test
  script:
    - docker-compose run web python manage.py test

deploy:
  stage: deploy
  script:
    - docker-compose up -d
  environment:
    name: production
    url: http://164.92.202.51:8000  # Remplacez par l'URL de votre application déployée sur DigitalOcean
  only:
    - master  # Déployer uniquement à partir de la branche master
