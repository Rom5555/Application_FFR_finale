variables:
  BUILD: "TRUE"
  TESTS: "FALSE"
  PRODUCTION: "TRUE"

  DJANGO_APPLICATION_NAME: "application_FFR"
  POSTGRES_TEST_USER: "postgres"
  POSTGRES_TEST_PASSWORD: "integration_pa$$word"
  POSTGRES_DB: "postgres"
  POSTGRES_HOST_AUTH_METHOD: trust
  POSTGRES_APPLICATION_DB: "application_ffr_db"
  POSTGRES_APPLICATION_USER: "user_integration"
  POSTGRES_APPLICATION_PASSWORD: "pa$$word_integration"
  POSTGRES_APPLICATION_HOST: "postgres"
  POSTGRES_APPLICATION_PORT: 5432

build-image:
  only:
    variables:
      - $BUILD == "TRUE"
  image: docker:20.10
  stage: build
  script:
    - docker login registry.gitlab.com -u $USER_GITLAB -p $REGISTRY_TOKEN
    - apk add --no-cache docker-compose
    - echo "Construction de l'image Docker à partir du fichier Dockerfile du repository..."
    - docker build -t $REGISTRY_PROJECT_PATH .
    - docker push $REGISTRY_PROJECT_PATH
  tags:
    - runner-perso-poste-tag

tests-migrations:
  only:
    variables:
      - $TESTS == "TRUE"
  image: python:3.10.8-slim-bullseye
  stage: test
  services:
    - postgres:14.5-alpine

  # --------------------------------------------------------------------------------------------------------------------
  # on s'assure que l'initalisation de la BDD est OK et que les migrations Django sont
  # réalisées avec succès
  # --------------------------------------------------------------------------------------------------------------------
  script:
    - apt -y update
    - apt -y install apt-utils
    - apt -y install net-tools postgresql-client libpq-dev
    - apt -y upgrade
    - pip3 install -r ./requirements.txt
    - echo "vérification de la connection à la BDD postgresql (conteneur instancié)"
    - psql -h "postgres" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT 'OK' AS status;"
    - echo "création de la base de données $POSTGRES_APPLICATION_DB"
    - createdb -h $POSTGRES_HOST -p $POSTGRES_PORT -U postgres $POSTGRES_APPLICATION_DB
    - echo "création de l'utilisateur $POSTGRES_APPLICATION_USER"
    - psql -h "postgres" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "create user $POSTGRES_APPLICATION_USER with encrypted password '$POSTGRES_APPLICATION_PASSWORD';"
    - echo "attribution des privilèges pour l'utilisateur $POSTGRES_APPLICATION_USER à la BDD $POSTGRES_APPLICATION_DB"
    - psql -h "postgres" -U "$POSTGRES_USER" -c "grant all privileges on database $POSTGRES_APPLICATION_DB to $POSTGRES_APPLICATION_USER;"
    - echo "Migrations Django"
    - ls -al
    - python3 manage.py makemigrations
    - python3 manage.py migrate
    - python3 manage.py check

  tags:
    - runner-perso-poste-tag

tests-unitaires:
  only:
    variables:
      - $TESTS == "TRUE"
  image: python:3.10.8-slim-bullseye
  stage: test
  services:
    - postgres:14.5-alpine

  # --------------------------------------------------------------------------------------------------------------------
  # on s'assure que les tests unitaires s'exécute avec succès.
  #
  # NB : le mécanisme de tests unitaires implémenté par Django va créer dynamiquement un base de données dédiée aux tests
  #      qui sera également détruite automatiquement par la suite.
  # --------------------------------------------------------------------------------------------------------------------
  script:
    - apt -y update
    - apt -y install apt-utils
    - apt -y install net-tools postgresql-client libpq-dev
    - apt -y upgrade
    - pip3 install -r ./requirements.txt
    - echo "Testing PostgreSQL connection"
    - until pg_isready -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER"; do echo "Waiting for PostgreSQL to be ready..."; sleep 2; done
    - echo "création de l'utilisateur $POSTGRES_APPLICATION_USER"
    - psql -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "create user $POSTGRES_APPLICATION_USER with encrypted password '$POSTGRES_APPLICATION_PASSWORD';"
    - echo "autorisation pour l'utilisateur $POSTGRES_APPLICATION_USER de créer une BDD afin de pouvoir exécuter les tests automatisés Django"
    - psql -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -c "ALTER USER $POSTGRES_APPLICATION_USER CREATEDB;"
    - echo "Tests Django"
    - python3 manage.py test --noinput

  tags:
    - runner-perso-poste-tag

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_SERVER_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - eval "$(ssh-agent -s)"
    - ssh-add ~/.ssh/id_rsa
    - ssh-keyscan -H $DEPLOYMENT_SERVER_IP >> ~/.ssh/known_hosts
  script:
    - echo "DATABASE_URL=${DATABASE_URL}" > .env
    - scp -r .env docker-compose.yml Dockerfile root@${DEPLOYMENT_SERVER_IP}:~/
    - ssh root@$DEPLOYMENT_SERVER_IP 'bash -s' << 'EOF'
        docker login registry.gitlab.com -u $USER_GITLAB -p $REGISTRY_TOKEN
        docker pull $REGISTRY_PROJECT_PATH
        apk add --no-cache docker-compose
        docker-compose up -d
        docker-compose exec web python manage.py makemigrations
        docker-compose exec web python manage.py migrate
        docker-compose exec web python manage.py createsuperuser --noinput --email $DJANGO_SUPERUSER_EMAIL --username $DJANGO_SUPERUSER_USERNAME
      EOF
  environment:
    name: production
    url: http://165.22.65.214:8000
  only:
    - master
  tags:
    - runner-perso-poste-tag

