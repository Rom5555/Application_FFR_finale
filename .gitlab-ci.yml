variables:
  BUILD: "TRUE"
  TESTS: "TRUE"
  PRODUCTION: "FALSE"

  DJANGO_APPLICATION_NAME: "Application_FFR"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "integration_pa$$word"
  POSTGRES_DB: "postgres"
  POSTGRES_HOST_AUTH_METHOD: trust
  POSTGRES_APPLICATION_DB: "application_FFR_db"
  POSTGRES_APPLICATION_USER: "user_integration"
  POSTGRES_APPLICATION_PASSWORD: "pa$$word_integration"
  POSTGRES_APPLICATION_HOST: "postgres"
  POSTGRES_APPLICATION_PORT: 5432

build-image:
  only:
    variables:
      - $BUILD == "TRUE"
  image: docker:20.10
  stage: build
  script:
    - docker login registry.gitlab.com -u $USER_GITLAB -p $REGISTRY_TOKEN
    - apk add --no-cache docker-compose
    - echo "Construction de l'image Docker à partir du fichier Dockerfile du repository..."
    - docker build -t $REGISTRY_PROJECT_PATH .
    - docker push $REGISTRY_PROJECT_PATH
  tags:
    - runner-perso-poste-tag

test:
  stage: test
  image: docker:20.10
  services:
    - docker:20.10-dind
  script:
    - docker login registry.gitlab.com -u $USER_GITLAB -p $REGISTRY_TOKEN
    - docker pull $REGISTRY_PROJECT_PATH
    - apk add --no-cache docker-compose
    - docker-compose up -d
    - docker-compose exec web ls /app  # Ajouté pour vérifier les fichiers dans le conteneur
    - docker-compose exec web python manage.py test
  tags:
    - runner-perso-poste-tag

deploy:
  stage: deploy
  image: docker:20.10
  services:
    - docker:20.10-dind
  script:
    - docker login registry.gitlab.com -u $USER_GITLAB -p $REGISTRY_TOKEN
    - docker pull $REGISTRY_PROJECT_PATH
    - apk add --no-cache docker-compose
    - docker-compose up -d
    - docker-compose exec web python manage.py createsuperuser
  environment:
    name: production
    url: http://164.92.202.51:8000
  only:
    - master
  tags:
    - runner-perso-poste-tag
