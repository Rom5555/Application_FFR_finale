stages:
  - build
  - test
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  BUILD: "TRUE"
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

before_script:
  - apk add --no-cache docker-compose  # Installation de Docker Compose sur Alpine Linux
  # - apt-get update && apt-get install -y docker-compose  # Installation de Docker Compose sur Debian/Ubuntu (décommentez si nécessaire)

build-image:
  stage: build
  image: docker:stable
  services:
    - name: docker:stable-dind
      alias: docker
  script:
    - echo "Authentification auprès de GitLab..."
    - echo $REGISTRY_TOKEN | docker login registry.gitlab.com -u $USER_GITLAB --password-stdin
    - echo "Construction de l'image Docker à partir du fichier Dockerfile du repository..."
    - docker --version
    - docker build -t $REGISTRY_PROJECT_PATH .
    - echo "Envoi de l'image sur le repository du projet GitLab distant..."
    - docker push $REGISTRY_PROJECT_PATH
  only:
    variables:
      - $BUILD == "TRUE"
  tags:
    - runner-perso-poste-tag

test:
  stage: test
  image: docker:stable
  services:
    - name: docker:stable-dind
      alias: docker
  script:
    - echo $REGISTRY_TOKEN | docker login registry.gitlab.com -u $USER_GITLAB --password-stdin
    - docker-compose run web python manage.py test
  tags:
    - runner-perso-poste-tag

deploy:
  stage: deploy
  image: docker:stable
  services:
    - name: docker:stable-dind
      alias: docker
  script:
    - echo $REGISTRY_TOKEN | docker login registry.gitlab.com -u $USER_GITLAB --password-stdin
    - docker-compose up -d
    - docker-compose exec web python manage.py createsuperuser
  environment:
    name: production
    url: http://164.92.202.51:8000
  only:
    - master
  tags:
    - runner-perso-poste-tag
