{% extends 'admin_base/base.html' %}
{% load crispy_forms_tags %}
{% block content %}

<style>
    .title-card-margin {
        margin-bottom: 3rem !important;
    }
</style>

<div class="columns is-centered">
        <div class="column is-full"> <!-- Prend toute la largeur -->
            <div class="card title-card-margin" style="box-shadow: 0 4px 8px rgba(50, 115, 220, 0.2);">
                <div class="card-content has-text-centered">
                    <h1 class="subtitle is-3 has-text-link has-text-centered mb-5 is-flex is-align-items-center is-justify-content-center">
                        <span class="icon has-text-info">
                            <i class="fas fa-clipboard-list"></i>
                        </span>
                        <span class="ml-4">Gestion des listes</span>
                    </h1>
                </div>
            </div>

             <div class="columns is-multiline"> <!-- Colonnes pour les cartes -->
                <div class="column is-full-mobile is-one-quarter-tablet is-one-quarter-desktop"> <!-- Responsive -->
                    <div class="card mb-4" style="box-shadow: 0 4px 8px rgba(255, 221, 87, 0.2);">
                        <div class="card-content has-text-centered">
                            <span class="icon has-text-success is-large" style="font-size: 2.5rem;">
                                <i class="fas fa-file-alt"></i>
                            </span>
                            <h2 class="subtitle is-4 mt-2 has-text-link">Modeles</h2>
                            <a href="{% url 'admin_liste:recherche_modele_liste' %}" class="button is-warning is-light">Acceder</a>
                        </div>
                    </div>
                </div>
            <!-- Colonnes pour les cartes -->
                <div class="column is-full-mobile is-one-quarter-tablet is-one-quarter-desktop"> <!-- Responsive -->
                    <div class="card mb-4" style="box-shadow: 0 4px 8px rgba(255, 221, 87, 0.2);">
                        <div class="card-content has-text-centered">
                            <span class="icon has-text-warning is-large" style="font-size: 2.5rem;">
                                <i class="fas fa-plane-departure"></i>
                            </span>
                            <h2 class="subtitle is-4 mt-2 has-text-link">Depart</h2>
                            <a href="{% url 'admin_liste:display_liste_en_preparation' %}" class="button is-warning is-light">Acceder</a>
                        </div>
                    </div>
                </div>

                <div class="column is-full-mobile is-one-quarter-tablet is-one-quarter-desktop"> <!-- Responsive -->
                    <div class="card mb-4" style="box-shadow: 0 4px 8px rgba(72, 199, 116, 0.2);">
                        <div class="card-content has-text-centered">
                            <span class="icon has-text-success is-large" style="font-size: 2.5rem;">
                                <i class="fas fa-plane-arrival"></i>
                            </span>
                            <h2 class="subtitle is-4 mt-2 has-text-link">Retour</h2>
                            <a href="{% url 'admin_liste:display_listes_envoyees' %}" class="button is-success is-light">Acceder</a>
                        </div>
                    </div>
                </div>

                <div class="column is-full-mobile is-one-quarter-tablet is-one-quarter-desktop"> <!-- Responsive -->
                    <div class="card mb-4" style="box-shadow: 0 4px 8px rgba(50, 115, 220, 0.2);">
                        <div class="card-content has-text-centered">
                            <span class="icon has-text-info is-large" style="font-size: 2.5rem;">
                                <i class="fas fa-archive"></i>
                            </span>
                            <h2 class="subtitle is-4 mt-2 has-text-link">Archives</h2>
                            <a href="{% url 'admin_liste:recherche_archive' %}" class="button is-info is-light">Acceder</a>
                        </div>
                    </div>
                </div>
            </div> <!-- Fin des colonnes pour les cartes -->
        </div> <!-- Fin de la colonne principale -->
    </div> <!-- Fin des colonnes -->


{% endblock content %}
