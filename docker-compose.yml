version: '3.8'

services:
  db:
    image: postgres:14.5-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_APPLCATION_DB}
      POSTGRES_USER: ${POSTGRES_APPLICATION_USER}
      POSTGRES_PASSWORD: ${POSTGRES_APPLICATION_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_APPLICATION_USER}:${POSTGRES_APPLICATION_PASSWORD}@db:5432/${POSTGRES_APPLICATION_DB}

volumes:
  postgres_data:
