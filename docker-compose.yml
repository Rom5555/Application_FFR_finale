version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: "application_ffr_db"
      POSTGRES_USER: "rom"
      POSTGRES_PASSWORD: "ballon"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

volumes:
  postgres_data:
